<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — UI prototype v0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d2740; --azure:#3b9be8; --ok:#2bb673; --wait:#f2a51a; --idle:#9bb0c2;
    --edge:rgba(110,175,235,0.55);
    --mono:'Share Tech Mono',Consolas,monospace; --tech:'Orbitron',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:var(--mono);color:var(--ink);
    background:
      radial-gradient(1200px 700px at 70% -10%, #eaf6ff 0%, transparent 60%),
      radial-gradient(900px 600px at 10% 110%, #e4f1fb 0%, transparent 55%),
      linear-gradient(180deg,#ffffff 0%,#f2f8ff 100%);}
  #ripple{position:fixed;inset:0;z-index:0;pointer-events:none}
  .brand{position:fixed;top:14px;left:20px;font-family:var(--tech);font-weight:700;letter-spacing:.22em;color:#7fa6c6;font-size:14px;z-index:6;user-select:none}
  .hint{position:fixed;top:14px;right:18px;font-size:11px;color:#90b0cc;max-width:42vw;text-align:right;z-index:6;user-select:none;font-family:var(--mono)}
  #sound{position:fixed;top:46px;left:20px;z-index:6;width:36px;height:36px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.5);backdrop-filter:blur(8px);cursor:pointer;font-size:15px}

  /* FAB orb Aqua */
  #fab{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;border:none;cursor:pointer;z-index:5;
    color:#fff;font-size:40px;line-height:78px;font-family:var(--tech);
    background:radial-gradient(circle at 32% 28%, #bfe3ff 0%, #4ea8ee 38%, #1f72b8 100%);
    box-shadow:0 12px 34px rgba(40,130,200,.45), inset 0 2px 6px rgba(255,255,255,.8), inset 0 -8px 16px rgba(20,90,150,.5)}
  #fab::after{content:"";position:absolute;left:18%;top:9%;width:64%;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
  #fab:hover{transform:translate(-50%,-50%) scale(1.07)}
  #fab.tucked{left:auto;right:26px;top:84px;transform:none;width:56px;height:56px;line-height:56px;font-size:30px}
  #fab.tucked:hover{transform:scale(1.07)}

  /* finestra: lastra di vetro QUASI trasparente */
  .term{position:absolute;z-index:10;min-width:300px;min-height:190px;width:470px;height:300px;border-radius:14px;
    background:rgba(244,250,255,0.07);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    border:1px solid var(--edge);display:flex;flex-direction:column;
    box-shadow:0 16px 40px rgba(40,110,180,.16), inset 0 0 22px rgba(255,255,255,.10);
    transition:background .3s,opacity .3s,filter .3s}
  .term.see{background:rgba(244,250,255,0.02)}     /* copre un'altra -> quasi invisibile */
  /* intestazione: BOLLA 3D */
  .term .bar{flex:0 0 38px;margin:7px 7px 0;border-radius:21px;display:flex;align-items:center;gap:9px;padding:0 13px;cursor:move;user-select:none;
    background:radial-gradient(120% 160% at 30% 12%, rgba(255,255,255,.96) 0%, rgba(206,234,255,.9) 30%, rgba(122,186,238,.92) 75%, rgba(70,140,205,.95) 100%);
    box-shadow:0 6px 16px rgba(40,110,180,.4), inset 0 2px 4px rgba(255,255,255,.95), inset 0 -6px 12px rgba(30,100,160,.4);
    position:relative;overflow:hidden}
  .term .bar::before{content:"";position:absolute;left:8%;top:8%;width:84%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
  .dot{width:13px;height:13px;border-radius:50%;cursor:pointer;flex:0 0 auto;z-index:1;
    background:radial-gradient(circle at 35% 30%,#9be8c2,var(--ok));box-shadow:0 0 0 0 rgba(43,182,115,.5)}
  .title{flex:1;font-family:var(--mono);font-size:13px;font-weight:400;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0a2f50;z-index:1;transition:opacity .5s;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .btns{display:flex;gap:6px;z-index:1}
  .btns button{width:23px;height:23px;border:none;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;color:#0a2f50;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.15)}
  .btns button:hover{background:#fff}
  .body{flex:1;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.6;letter-spacing:.03em;overflow:auto;white-space:pre-wrap;
    color:#0c344f;text-shadow:0 1px 1px rgba(255,255,255,.5)}
  .body .sys{color:#1f72b8}.body .ok{color:#159c63}
  .caret{display:inline-block;width:9px;height:16px;background:#0c344f;vertical-align:-3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .resize{position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--edge) 50%);border-radius:0 0 12px 0}

  .term.waiting .bar{background:radial-gradient(120% 160% at 30% 12%, #fff 0%, #ffe9bd 35%, #f6c25e 80%, #e09a18 100%)}
  .term.waiting{animation:wobble 2.4s ease-in-out infinite}
  .term.waiting .dot{background:radial-gradient(circle at 35% 30%,#ffe0a0,var(--wait));animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,165,26,.55)}50%{box-shadow:0 0 0 8px rgba(242,165,26,0)}}
  @keyframes wobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .term.idle{filter:grayscale(.85);opacity:.5}
  .term.idle .dot{background:var(--idle);box-shadow:none}

  /* DOCK "menu finestre" stile macOS */
  #dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;max-width:92vw;
    display:flex;gap:12px;align-items:flex-end;padding:10px 16px;border-radius:20px;overflow-x:auto;overflow-y:hidden;
    background:rgba(255,255,255,.5);backdrop-filter:blur(12px);border:1px solid var(--edge);box-shadow:0 12px 30px rgba(40,110,180,.22);scrollbar-width:thin}
  #dock:empty{display:none}
  .sheet{flex:0 0 auto;width:58px;height:74px;border-radius:8px;cursor:pointer;position:relative;transform-origin:bottom center;transition:transform .16s ease, box-shadow .16s;
    background:linear-gradient(160deg,#ffffff,#eaf4ff);border:1px solid #cfe2f5;box-shadow:0 4px 10px rgba(40,110,180,.2);overflow:hidden}
  .sheet::before{content:"";position:absolute;left:6px;right:6px;top:8px;height:3px;border-radius:2px;background:#bcd6ef;box-shadow:0 7px 0 #d3e6f8,0 14px 0 #d3e6f8,0 21px 0 #e2eefb} /* righe = foglio */
  .sheet .sd{position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .sheet.waiting .sd{background:var(--wait);animation:pulse 1.1s ease-in-out infinite}
  .sheet.idle{filter:grayscale(1);opacity:.65}
  .sheet .lbl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--mono);font-size:8px;color:#3a5f80;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet:hover{transform:scale(1.55) translateY(-12px);box-shadow:0 16px 30px rgba(40,110,180,.4);z-index:2}
  .sheet.hidden-win{opacity:.55}
</style>
</head>
<body>
  <canvas id="ripple"></canvas>
  <div class="brand">J A R V I S</div>
  <div class="hint">+ nuovo terminale · trascina la bolla per spostare · angolo per ridimensionare · pallino = stato · "–" nasconde · dock in basso = menu finestre (passa sopra per ingrandire)</div>
  <button id="sound" title="Suoni on/off">🔊</button>
  <button id="fab" title="Nuovo terminale">+</button>
  <div id="dock"></div>

<script>
(function(){
  /* AUDIO */
  let AC=null, soundOn=true;
  function actx(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
  function bubble(){ if(!soundOn)return; const c=actx(); if(!c)return; const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(680,t+.12);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+.24); }
  function droplet(){ if(!soundOn)return; const c=actx(); if(!c)return; const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(320,t+.10);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+.18); }
  document.getElementById('sound').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn){actx();bubble();}});

  /* ONDE */
  const cv=document.getElementById('ripple'),cx=cv.getContext('2d');let W,H;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
  const rip=[];let amb=0;
  function ripple(x,y,s){rip.push({x,y,r:2,max:s?320:200,a:s?.5:.3});}
  function loop(){cx.clearRect(0,0,W,H);amb+=0.012;
    for(let i=0;i<3;i++){const yy=H*(0.25+0.27*i)+Math.sin(amb+i*2)*22;const g=cx.createLinearGradient(0,yy-90,0,yy+90);
      g.addColorStop(0,'rgba(160,205,240,0)');g.addColorStop(.5,'rgba(150,200,238,'+(0.05+0.02*Math.sin(amb*1.3+i))+')');g.addColorStop(1,'rgba(160,205,240,0)');
      cx.fillStyle=g;cx.fillRect(0,yy-90,W,180);}
    for(let i=rip.length-1;i>=0;i--){const r=rip[i];r.r+=2.4;r.a*=0.975;
      cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.strokeStyle='rgba(70,150,215,'+r.a+')';cx.lineWidth=2;cx.stroke();
      if(r.r>r.max||r.a<0.02)rip.splice(i,1);}
    requestAnimationFrame(loop);}
  loop();setInterval(()=>ripple(Math.random()*W,Math.random()*H,false),2600);
  addEventListener('mousedown',e=>{if(e.target.id==='ripple'||e.target===document.body)ripple(e.clientX,e.clientY,false);});

  /* TERMINALI + DOCK */
  const fab=document.getElementById('fab'),dock=document.getElementById('dock');
  let z=10,n=0,cascade=0;
  const states=['active','waiting','idle'],stl={active:'attivo',waiting:'in attesa di input',idle:'fermo'};
  const headlines=["Sessione avviata","Analizzo la richiesta…","Recupero dal Vault","Configurazione servizi","Riepilogo task del giorno","Bozze email pronte","In attesa di una scelta","Sintesi completata"];
  function rect(el){return el.getBoundingClientRect();}
  function intersect(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);}
  function updateSee(){const L=[...document.querySelectorAll('.term')].filter(t=>t.style.display!=='none');
    L.forEach(A=>{const ra=rect(A),za=+A.style.zIndex;let c=false;L.forEach(B=>{if(B!==A&&(+B.style.zIndex)<za&&intersect(ra,rect(B)))c=true;});A.classList.toggle('see',c);});}
  function front(el){el.style.zIndex=++z;updateSee();}

  function makeTerminal(){
    n++;const id=n;const el=document.createElement('div');el.className='term';el.dataset.state='active';el._id=id;el._title='Terminale '+id;
    el.style.left=(90+(cascade%6)*44)+'px';el.style.top=(70+(cascade%6)*38)+'px';el.style.zIndex=++z;cascade++;
    el.innerHTML=`<div class="bar"><span class="dot" title="Stato: attivo (clic per cambiare)"></span>
      <span class="title">Terminale ${id}</span>
      <span class="btns"><button class="min" title="Nascondi (resta nel dock)">–</button><button class="close" title="Chiudi">×</button></span></div>
      <div class="body"><span class="sys">JARVIS › sessione ${id} avviata</span>
<span class="ok">&gt; pronto</span>
&gt; <span class="caret"></span></div><div class="resize"></div>`;
    document.body.appendChild(el);bubble();ripple(el.offsetLeft+40,el.offsetTop+20,true);

    el.addEventListener('mousedown',()=>front(el));
    const bar=el.querySelector('.bar');
    bar.addEventListener('mousedown',e=>{if(e.target.closest('button')||e.target.classList.contains('dot'))return;
      const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
      const mv=ev=>{el.style.left=(ox+ev.clientX-sx)+'px';el.style.top=(oy+ev.clientY-sy)+'px';updateSee();};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
    el.querySelector('.resize').addEventListener('mousedown',e=>{e.stopPropagation();
      const sx=e.clientX,sy=e.clientY,ow=el.offsetWidth,oh=el.offsetHeight;
      const mv=ev=>{el.style.width=Math.max(300,ow+ev.clientX-sx)+'px';el.style.height=Math.max(190,oh+ev.clientY-sy)+'px';updateSee();};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
    el.querySelector('.dot').addEventListener('click',e=>{e.stopPropagation();let i=(states.indexOf(el.dataset.state)+1)%3;setState(el,states[i]);droplet();});
    el.querySelector('.min').addEventListener('click',e=>{e.stopPropagation();el.style.display='none';droplet();updateSee();syncSheet(el);});
    el.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();droplet();ripple(el.offsetLeft+40,el.offsetTop+20,false);el.remove();const s=dock.querySelector('[data-sheet="'+id+'"]');if(s)s.remove();updateSee();});

    // foglio nel dock
    const sh=document.createElement('div');sh.className='sheet';sh.dataset.sheet=id;
    sh.innerHTML='<span class="sd"></span><span class="lbl">Term '+id+'</span>';
    sh.addEventListener('click',()=>{el.style.display='flex';front(el);bubble();syncSheet(el);});
    dock.appendChild(sh);

    el._timer=setInterval(()=>{ if(el.dataset.state==='waiting')el._title='⏳ In attesa di input';
      else if(el.dataset.state==='idle')el._title='Sessione in pausa';
      else el._title=headlines[Math.floor(Math.random()*headlines.length)];
      const t=el.querySelector('.title');t.style.opacity=0;
      setTimeout(()=>{t.textContent=el._title;t.style.opacity=1;const lbl=sh.querySelector('.lbl');if(lbl)lbl.textContent=el._title;},250);
    },6000);
    updateSee();
  }
  function syncSheet(el){const sh=dock.querySelector('[data-sheet="'+el._id+'"]');if(sh)sh.classList.toggle('hidden-win',el.style.display==='none');}
  function setState(el,s){el.dataset.state=s;el.classList.remove('waiting','idle');if(s!=='active')el.classList.add(s);
    el.querySelector('.dot').title='Stato: '+stl[s]+' (clic per cambiare)';
    const sh=dock.querySelector('[data-sheet="'+el._id+'"]');if(sh){sh.classList.remove('waiting','idle');if(s!=='active')sh.classList.add(s);}}

  fab.addEventListener('click',()=>{actx();makeTerminal();fab.classList.add('tucked');});
})();
</script>
</body>
</html>
