<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — UI prototype v0.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c344f; --ok:#2bb673; --wait:#f2a51a; --idle:#9bb0c2;
    --edge:rgba(95,160,220,0.85);
    --mono:'Share Tech Mono',Consolas,monospace; --tech:'Orbitron',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:var(--mono);color:var(--ink);
    background:
      radial-gradient(1200px 700px at 70% -10%, #eaf6ff 0%, transparent 60%),
      radial-gradient(900px 600px at 10% 110%, #e4f1fb 0%, transparent 55%),
      linear-gradient(180deg,#ffffff 0%,#f2f8ff 100%);}
  #ripple{position:fixed;inset:0;z-index:0;pointer-events:none}
  .brand{position:fixed;top:14px;left:20px;font-family:var(--tech);font-weight:700;letter-spacing:.22em;color:#7fa6c6;font-size:14px;z-index:6;user-select:none}
  .hint{position:fixed;top:14px;right:18px;font-size:11px;color:#90b0cc;max-width:42vw;text-align:right;z-index:6;user-select:none}
  #sound{position:fixed;top:46px;left:20px;z-index:6;width:36px;height:36px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.5);backdrop-filter:blur(8px);cursor:pointer;font-size:15px}

  #fab{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:none;cursor:pointer;z-index:5;
    color:#fff;font-family:var(--tech);display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 28%, #bfe3ff 0%, #4ea8ee 38%, #1f72b8 100%);
    box-shadow:0 12px 34px rgba(40,130,200,.45), inset 0 2px 6px rgba(255,255,255,.8), inset 0 -8px 16px rgba(20,90,150,.5);
    transition:width .35s cubic-bezier(.2,.8,.2,1), height .35s cubic-bezier(.2,.8,.2,1), font-size .35s, transform .14s}
  #fab::after{content:"";position:absolute;left:18%;top:9%;width:64%;height:36%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
  #fab:hover{transform:translate(-50%,-50%) scale(1.06)}

  /* finestra: TELAIO DI VETRO — fill trasparente, si vede solo lo spessore */
  .term{position:absolute;z-index:10;min-width:280px;min-height:170px;width:470px;height:300px;border-radius:13px;
    background:transparent;border:1px solid var(--edge);display:flex;flex-direction:column;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.55),                 /* riflesso interno bordo */
      6px 8px 0 -1px rgba(120,175,225,.55),                  /* faccia laterale (spessore) */
      11px 14px 0 -3px rgba(120,175,225,.30),                /* spessore 2 */
      0 20px 40px rgba(40,110,180,.16);
    transition:opacity .25s, filter .25s, width .28s ease, height .28s ease}
  .term .bar{flex:0 0 34px;display:flex;align-items:center;gap:9px;padding:0 12px;cursor:move;user-select:none;
    border-radius:12px 12px 0 0;background:transparent;border-bottom:1px solid rgba(120,175,225,.45)}
  .dot{width:12px;height:12px;border-radius:50%;cursor:pointer;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#9be8c2,var(--ok));box-shadow:0 0 0 0 rgba(43,182,115,.5)}
  .title{flex:1;font-family:var(--mono);font-size:13px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0a2f50;transition:opacity .5s;text-shadow:0 1px 0 rgba(255,255,255,.85)}
  .btns{display:flex;gap:6px}
  .btns button{width:22px;height:22px;border:none;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;color:#0a2f50;background:rgba(255,255,255,.66);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.12)}
  .btns button:hover{background:#fff}
  .body{flex:1;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.6;letter-spacing:.03em;overflow:auto;white-space:pre-wrap;color:#0c344f;text-shadow:0 1px 2px rgba(255,255,255,.7)}
  .body .sys{color:#1f72b8}.body .ok{color:#159c63}
  .caret{display:inline-block;width:9px;height:16px;background:#0c344f;vertical-align:-3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .resize{position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--edge) 50%);border-radius:0 0 12px 0}

  /* COLLASSATA = solo intestazione (tab), resta in posizione */
  .term.collapsed{height:auto!important;width:auto!important;min-width:0;min-height:0;border-radius:12px}
  .term.collapsed .bar{border-bottom:none;border-radius:12px;padding-right:12px}
  .term.collapsed .body,.term.collapsed .resize{display:none}
  .term.collapsed .title{max-width:230px}

  .term.waiting{animation:wobble 2.4s ease-in-out infinite}
  .term.waiting .dot{background:radial-gradient(circle at 35% 30%,#ffe0a0,var(--wait));animation:pulse 1.1s ease-in-out infinite}
  .term.waiting{border-color:var(--wait)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,165,26,.55)}50%{box-shadow:0 0 0 8px rgba(242,165,26,0)}}
  @keyframes wobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .term.idle{filter:grayscale(.85);opacity:.5}.term.idle .dot{background:var(--idle);box-shadow:none}
</style>
</head>
<body>
  <canvas id="ripple"></canvas>
  <div class="brand">J A R V I S</div>
  <div class="hint">+ al centro (scala col n° finestre) · trascina la barra · doppio clic sull'intestazione = comprimi/espandi (resta in posizione) · pallino = stato · angolo per ridimensionare</div>
  <button id="sound" title="Suoni on/off">🔊</button>
  <button id="fab" title="Nuovo terminale">+</button>

<script>
(function(){
  let AC=null, soundOn=true;
  function actx(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
  function bubble(){ if(!soundOn)return; const c=actx(); if(!c)return; const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(680,t+.12);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+.24);}
  function droplet(){ if(!soundOn)return; const c=actx(); if(!c)return; const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(320,t+.10);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+.18);}
  document.getElementById('sound').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn){actx();bubble();}});

  const cv=document.getElementById('ripple'),cx=cv.getContext('2d');let W,H;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
  const rip=[];let amb=0;
  function ripple(x,y,s){rip.push({x,y,r:2,max:s?320:200,a:s?.5:.3});}
  function loop(){cx.clearRect(0,0,W,H);amb+=0.012;
    for(let i=0;i<3;i++){const yy=H*(0.25+0.27*i)+Math.sin(amb+i*2)*22;const g=cx.createLinearGradient(0,yy-90,0,yy+90);
      g.addColorStop(0,'rgba(160,205,240,0)');g.addColorStop(.5,'rgba(150,200,238,'+(0.05+0.02*Math.sin(amb*1.3+i))+')');g.addColorStop(1,'rgba(160,205,240,0)');
      cx.fillStyle=g;cx.fillRect(0,yy-90,W,180);}
    for(let i=rip.length-1;i>=0;i--){const r=rip[i];r.r+=2.4;r.a*=0.975;
      cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.strokeStyle='rgba(70,150,215,'+r.a+')';cx.lineWidth=2;cx.stroke();
      if(r.r>r.max||r.a<0.02)rip.splice(i,1);}
    requestAnimationFrame(loop);}
  loop();setInterval(()=>ripple(Math.random()*W,Math.random()*H,false),2600);
  addEventListener('mousedown',e=>{if(e.target.id==='ripple'||e.target===document.body)ripple(e.clientX,e.clientY,false);});

  const fab=document.getElementById('fab');
  let z=10,n=0,cascade=0,openCount=0;
  const states=['active','waiting','idle'],stl={active:'attivo',waiting:'in attesa di input',idle:'fermo'};
  const headlines=["Sessione avviata","Analizzo la richiesta…","Recupero dal Vault","Configurazione servizi","Riepilogo task del giorno","Bozze email pronte","In attesa di una scelta","Sintesi completata"];
  function updateFab(){const s=Math.max(46,116-openCount*15);fab.style.width=s+'px';fab.style.height=s+'px';fab.style.fontSize=(s*0.5)+'px';}
  updateFab();
  function front(el){el.style.zIndex=++z;}

  function toggleCollapse(el){
    if(el.classList.contains('collapsed')){ // espandi (stessa posizione)
      el.classList.remove('collapsed'); el.style.width=el._w+'px'; el.style.height=el._h+'px'; bubble();
    } else { // comprimi (stessa posizione)
      el._w=el.offsetWidth; el._h=el.offsetHeight; el.classList.add('collapsed'); el.style.width=''; el.style.height=''; droplet();
    }
    front(el);
  }

  function makeTerminal(){
    n++;const id=n;openCount++;updateFab();
    const el=document.createElement('div');el.className='term';el.dataset.state='active';el._id=id;el._title='Terminale '+id;el._w=470;el._h=300;
    el.style.left=(90+(cascade%6)*44)+'px';el.style.top=(70+(cascade%6)*38)+'px';el.style.zIndex=++z;cascade++;
    el.innerHTML=`<div class="bar"><span class="dot" title="Stato: attivo (clic per cambiare)"></span>
      <span class="title">Terminale ${id}</span>
      <span class="btns"><button class="min" title="Comprimi/espandi (o doppio clic)">–</button><button class="close" title="Chiudi">×</button></span></div>
      <div class="body"><span class="sys">JARVIS › sessione ${id} avviata</span>
<span class="ok">&gt; pronto</span>
&gt; <span class="caret"></span></div><div class="resize"></div>`;
    document.body.appendChild(el);bubble();ripple(el.offsetLeft+40,el.offsetTop+20,true);

    el.addEventListener('mousedown',()=>front(el));
    const bar=el.querySelector('.bar');
    bar.addEventListener('mousedown',e=>{if(e.target.closest('button')||e.target.classList.contains('dot'))return;
      const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
      const mv=ev=>{el.style.left=(ox+ev.clientX-sx)+'px';el.style.top=(oy+ev.clientY-sy)+'px';};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
    bar.addEventListener('dblclick',e=>{if(e.target.closest('button')||e.target.classList.contains('dot'))return;toggleCollapse(el);});

    el.querySelector('.resize').addEventListener('mousedown',e=>{e.stopPropagation();
      const sx=e.clientX,sy=e.clientY,ow=el.offsetWidth,oh=el.offsetHeight;
      const mv=ev=>{el.style.width=Math.max(280,ow+ev.clientX-sx)+'px';el.style.height=Math.max(170,oh+ev.clientY-sy)+'px';};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
    el.querySelector('.dot').addEventListener('click',e=>{e.stopPropagation();let i=(states.indexOf(el.dataset.state)+1)%3;setState(el,states[i]);droplet();});
    el.querySelector('.min').addEventListener('click',e=>{e.stopPropagation();toggleCollapse(el);});
    el.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();droplet();ripple(el.offsetLeft+40,el.offsetTop+20,false);el.remove();openCount--;updateFab();});

    el._timer=setInterval(()=>{ if(el.dataset.state==='waiting')el._title='⏳ In attesa di input';
      else if(el.dataset.state==='idle')el._title='Sessione in pausa';
      else el._title=headlines[Math.floor(Math.random()*headlines.length)];
      const t=el.querySelector('.title');t.style.opacity=0;setTimeout(()=>{t.textContent=el._title;t.style.opacity=1;},250);
    },6000);
  }
  function setState(el,s){el.dataset.state=s;el.classList.remove('waiting','idle');if(s!=='active')el.classList.add(s);
    el.querySelector('.dot').title='Stato: '+stl[s]+' (clic per cambiare)';}

  fab.addEventListener('click',()=>{actx();makeTerminal();});
})();
</script>
</body>
</html>
