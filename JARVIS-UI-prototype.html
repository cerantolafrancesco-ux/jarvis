<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — UI prototype v0.1</title>
<style>
  :root{
    --canvas:#f4f6fb;
    --grid:#e2e7f0;
    --glass:rgba(18,22,33,0.80);     /* terminale: vetro scuro semitrasparente */
    --glass-border:rgba(120,160,255,0.35);
    --ink:#dfe6f5;
    --accent:#3b82f6;
    --ok:#34d399;
    --wait:#fbbf24;
    --idle:#9aa3b2;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:var(--canvas);
    background-image:radial-gradient(var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
    overflow:hidden;color:#1e2433;
  }
  /* intestazione minimale */
  .brand{position:fixed;top:14px;left:18px;font-weight:600;letter-spacing:.12em;color:#9aa3b2;font-size:13px;user-select:none}
  .hint{position:fixed;top:14px;right:18px;font-size:12px;color:#aab2c2;user-select:none;max-width:46vw;text-align:right}

  /* FAB + centrale */
  #fab{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 30% 30%,#5b9bff,#2563eb);
    color:#fff;font-size:38px;line-height:74px;text-align:center;
    box-shadow:0 10px 30px rgba(37,99,235,.45);transition:transform .12s, box-shadow .12s;z-index:5;
  }
  #fab:hover{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 14px 40px rgba(37,99,235,.55)}
  #fab.tucked{left:auto;right:24px;top:auto;bottom:84px;transform:none;width:56px;height:56px;line-height:56px;font-size:30px}
  #fab.tucked:hover{transform:scale(1.06)}

  /* finestra terminale (vetro) */
  .term{
    position:absolute;min-width:280px;min-height:170px;width:440px;height:280px;
    background:var(--glass);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    border:1px solid var(--glass-border);border-radius:12px;overflow:hidden;
    box-shadow:0 18px 50px rgba(20,30,60,.28);display:flex;flex-direction:column;color:var(--ink);
    transition:filter .25s, opacity .25s, box-shadow .2s;
  }
  .term .bar{
    height:34px;flex:0 0 34px;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:move;
    background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);user-select:none;
  }
  .dot{width:11px;height:11px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 0 rgba(52,211,153,.6);cursor:pointer}
  .title{font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
  .bar .btns{display:flex;gap:6px}
  .bar .btns button{width:22px;height:22px;border:none;border-radius:6px;background:rgba(255,255,255,.10);color:var(--ink);cursor:pointer;font-size:13px;line-height:1}
  .bar .btns button:hover{background:rgba(255,255,255,.2)}
  .body{flex:1;padding:12px 14px;font-family:'Cascadia Code',Consolas,monospace;font-size:12.5px;line-height:1.5;overflow:auto;white-space:pre-wrap}
  .body .sys{color:#8fb6ff}
  .body .ok{color:var(--ok)}
  .caret{display:inline-block;width:8px;height:15px;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .resize{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;opacity:.5;
    background:linear-gradient(135deg,transparent 50%,var(--glass-border) 50%);border-radius:0 0 10px 0}

  /* STATI */
  .term.waiting{border-color:var(--wait)}
  .term.waiting .bar{background:rgba(251,191,36,.12)}
  .term.waiting .dot{background:var(--wait);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.55)}50%{box-shadow:0 0 0 7px rgba(251,191,36,0)}}
  .term.idle{filter:grayscale(1) brightness(.85);opacity:.7}
  .term.idle .dot{background:var(--idle);animation:none;box-shadow:none}

  /* barra delle tab in basso */
  #tabbar{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;gap:8px;align-items:center;
    padding:0 12px;background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border-top:1px solid #e2e7f0;z-index:4}
  .tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;cursor:pointer;
    background:var(--glass);color:var(--ink);font-size:12.5px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--glass-border)}
  .tab .d{width:9px;height:9px;border-radius:50%;background:var(--ok)}
  .tab.waiting .d{background:var(--wait);animation:pulse 1.1s ease-in-out infinite}
  .tab.idle{filter:grayscale(1);opacity:.7}
  .tab.idle .d{background:var(--idle)}
</style>
</head>
<body>
  <div class="brand">JARVIS</div>
  <div class="hint">Premi <b>+</b> per un nuovo terminale · trascina la barra per spostare · angolo per ridimensionare · clic sul pallino di stato per ciclare (attivo → in attesa → fermo) · "–" impila in tab</div>

  <button id="fab" title="Nuovo terminale">+</button>
  <div id="tabbar"></div>

<script>
(function(){
  const canvas=document.body, tabbar=document.getElementById('tabbar'), fab=document.getElementById('fab');
  let z=10, n=0, cascade=0;
  const states=['active','waiting','idle'];
  const stateLabel={active:'attivo',waiting:'in attesa di input',idle:'fermo'};

  function bringFront(el){ el.style.zIndex=++z; }

  function makeTerminal(){
    n++; const id=n;
    const el=document.createElement('div');
    el.className='term'; el.dataset.state='active';
    const x=90+(cascade%6)*40, y=70+(cascade%6)*36; cascade++;
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.zIndex=++z;
    el.innerHTML=`
      <div class="bar">
        <span class="dot" title="Stato: attivo (clic per cambiare)"></span>
        <span class="title">Terminale ${id}</span>
        <span class="btns">
          <button class="min" title="Impila in tab">–</button>
          <button class="close" title="Chiudi">×</button>
        </span>
      </div>
      <div class="body"><span class="sys">JARVIS › sessione ${id} avviata</span>
<span class="ok">✓ pronto</span>
› <span class="caret"></span></div>
      <div class="resize"></div>`;
    canvas.appendChild(el);

    // focus / z-order
    el.addEventListener('mousedown',()=>bringFront(el));

    // drag dalla barra
    const bar=el.querySelector('.bar');
    bar.addEventListener('mousedown',e=>{
      if(e.target.closest('button')||e.target.classList.contains('dot'))return;
      const sx=e.clientX, sy=e.clientY, ox=el.offsetLeft, oy=el.offsetTop;
      const mv=ev=>{el.style.left=(ox+ev.clientX-sx)+'px'; el.style.top=(oy+ev.clientY-sy)+'px';};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });

    // resize
    const rz=el.querySelector('.resize');
    rz.addEventListener('mousedown',e=>{
      e.stopPropagation();
      const sx=e.clientX, sy=e.clientY, ow=el.offsetWidth, oh=el.offsetHeight;
      const mv=ev=>{el.style.width=Math.max(280,ow+ev.clientX-sx)+'px'; el.style.height=Math.max(170,oh+ev.clientY-sy)+'px';};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });

    // ciclo stati (clic sul dot)
    const dot=el.querySelector('.dot');
    dot.addEventListener('click',e=>{e.stopPropagation();
      let i=states.indexOf(el.dataset.state); i=(i+1)%states.length; setState(el,states[i]);});

    // minimize -> tab
    el.querySelector('.min').addEventListener('click',e=>{e.stopPropagation();minimize(el,id);});
    // close
    el.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();el.remove();removeTab(id);});

    el._id=id;
    return el;
  }

  function setState(el,s){
    el.dataset.state=s; el.classList.remove('waiting','idle');
    if(s==='waiting')el.classList.add('waiting'); if(s==='idle')el.classList.add('idle');
    el.querySelector('.dot').title='Stato: '+stateLabel[s]+' (clic per cambiare)';
    const t=tabbar.querySelector('[data-tab="'+el._id+'"]');
    if(t){t.classList.remove('waiting','idle'); if(s!=='active')t.classList.add(s);}
  }

  function minimize(el,id){
    el.style.display='none';
    if(tabbar.querySelector('[data-tab="'+id+'"]'))return;
    const tab=document.createElement('div'); tab.className='tab'; tab.dataset.tab=id;
    const s=el.dataset.state; if(s!=='active')tab.classList.add(s);
    tab.innerHTML='<span class="d"></span> Terminale '+id;
    tab.addEventListener('click',()=>{el.style.display='flex';bringFront(el);tab.remove();});
    tabbar.appendChild(tab);
  }
  function removeTab(id){const t=tabbar.querySelector('[data-tab="'+id+'"]');if(t)t.remove();}

  fab.addEventListener('click',()=>{ makeTerminal(); fab.classList.add('tucked'); fab.title='Nuovo terminale'; });
})();
</script>
</body>
</html>
